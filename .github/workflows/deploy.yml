# Builds the site and publishes it to GitHub Pages.
#
# This has to exist because the repository holds source, not a website: the
# browser cannot run a .vue file. `quasar build` compiles everything into
# dist/spa, and that folder is what gets published.
#
# One-time setup, on github.com: Settings -> Pages -> Source -> "GitHub Actions".
# Leaving it on "Deploy from a branch" publishes the raw source tree instead,
# which serves an index.html full of unreplaced template placeholders.
name: Deploy to GitHub Pages

on:
  push:
    branches: [dashe_shawn, main]
  # Lets you redeploy by hand from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win rather than queue behind an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and the
      # postinstall script runs `quasar prepare` for us.
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
