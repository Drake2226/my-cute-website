<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <!-- The three fonts used to be fetched from Google here. They are bundled
         now (src/css/_fonts.scss, generated by scripts/fetch-fonts.mjs) so an
         installed copy still renders as itself with the network off. -->

    <meta name="theme-color" content="#ffe3ef" />

    <!-- The manifest link, the apple-touch-icons, mobile-web-app-capable and
         the status-bar style are injected by Quasar's PWA mode out of
         src-pwa/manifest.json — writing those here would only duplicate them
         and let the two drift apart.

         There is deliberately no `apple-mobile-web-app-capable` beside them:
         it is deprecated, Chrome warns about it in the console, and every iOS
         since 16.4 reads the unprefixed `mobile-web-app-capable` that Quasar
         already injects.

         This one stays because Quasar's injected home-screen title is the
         manifest `name`, "Meet Dawn — Real Connections", and iOS truncates a
         home-screen label at about twelve characters. This tag comes first,
         and the first one wins. -->
    <meta name="apple-mobile-web-app-title" content="Meet Dawn" />

    <!-- Safari pinned tabs take a one-colour mask, not a picture, so the badge
         cannot be used here. Quasar injects a mask-icon too, but colours it
         with the manifest's theme colour — a pale blush that all but vanishes
         on Safari's tab strip. This one is the badge pink and comes first. -->
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#c62b64" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
