<!doctype html>
<!--
  The letter. Paste this whole file into your EmailJS template:
  emailjs.com -> Email Templates -> your template -> Content -> the "<>" code button.

  You can also open this file in a browser to preview it; the {{placeholders}}
  will show as literal text until EmailJS fills them in.

  Email clients ignore most modern CSS, so this is built the old way: tables,
  inline styles, and web-safe fonts that stand in for the site's Baloo 2,
  Press Start 2P and Courier Prime.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
    <style>
      /* Progressive extras. Clients that drop <style> still get the flat pink. */
      .lm-room {
        background-color: #ffe3ef;
        background-image:
          radial-gradient(circle, rgba(255, 194, 221, 0.9) 3px, transparent 3.5px),
          radial-gradient(circle, rgba(255, 217, 125, 0.55) 2px, transparent 2.5px);
        background-size:
          38px 38px,
          38px 38px;
        background-position:
          0 0,
          19px 19px;
      }

      @media only screen and (max-width: 620px) {
        .lm-console {
          width: 100% !important;
        }
        .lm-pad {
          padding: 22px 16px !important;
        }
        .lm-headline {
          font-size: 26px !important;
        }
      }
    </style>
  </head>

  <body style="margin: 0; padding: 0; background-color: #ffe3ef">
    <!-- Inbox preview line -->
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
        height: 0;
        width: 0;
      "
    >
      She said yes — {{date_icon}} {{date_type}} on {{date_label}}
    </div>

    <table
      role="presentation"
      class="lm-room"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #ffe3ef"
    >
      <tr>
        <td align="center" style="padding: 30px 12px">
          <!-- The console -->
          <table
            role="presentation"
            class="lm-console"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 600px;
              max-width: 600px;
              background-color: #ffc2dd;
              border: 3px solid #4a2b3d;
              border-radius: 26px;
            "
          >
            <tr>
              <td style="padding: 16px">
                <!-- Nameplate -->
                <p
                  style="
                    margin: 4px 0 12px;
                    text-align: center;
                    font-family: 'Courier New', Courier, monospace;
                    font-size: 11px;
                    font-weight: bold;
                    letter-spacing: 3px;
                    color: #6b4356;
                  "
                >
                  &#9825; LOVE-MACHINE 3000 &#9825;
                </p>

                <!-- The screen -->
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="background-color: #fff6ea; border: 3px solid #4a2b3d; border-radius: 14px"
                >
                  <!-- HUD strip -->
                  <tr>
                    <td
                      style="
                        padding: 10px 16px;
                        background-color: #ffd6e7;
                        border-bottom: 2px dashed #b9899d;
                        border-radius: 11px 11px 0 0;
                        font-family: 'Courier New', Courier, monospace;
                        font-size: 11px;
                        font-weight: bold;
                        letter-spacing: 2px;
                        color: #4a2b3d;
                      "
                    >
                      LVL 4/4 &middot; YOU WIN
                    </td>
                  </tr>

                  <!-- Body -->
                  <tr>
                    <td class="lm-pad" style="padding: 30px 30px 34px">
                      <p
                        style="
                          margin: 0;
                          text-align: center;
                          font-family: 'Courier New', Courier, monospace;
                          font-size: 11px;
                          font-weight: bold;
                          letter-spacing: 3px;
                          color: #ff5fa2;
                        "
                      >
                        &#9733; SHE SAID YES &#9733;
                      </p>

                      <p style="margin: 14px 0 0; text-align: center; font-size: 46px">💖</p>

                      <h1
                        class="lm-headline"
                        style="
                          margin: 10px 0 0;
                          text-align: center;
                          font-family: 'Trebuchet MS', Verdana, sans-serif;
                          font-size: 32px;
                          font-weight: bold;
                          line-height: 1.15;
                          color: #4a2b3d;
                        "
                      >
                        It's a date 💕
                      </h1>

                      <!-- The ticket -->
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="margin: 24px 0 0"
                      >
                        <tr>
                          <td
                            align="center"
                            style="
                              padding: 18px 16px;
                              background-color: #fff0f6;
                              border: 3px solid #4a2b3d;
                              border-radius: 12px;
                            "
                          >
                            <p
                              style="
                                margin: 0;
                                font-family: 'Courier New', Courier, monospace;
                                font-size: 15px;
                                color: #6b4356;
                              "
                            >
                              {{date_label}}
                            </p>
                            <p
                              style="
                                margin: 8px 0 0;
                                font-family: 'Trebuchet MS', Verdana, sans-serif;
                                font-size: 22px;
                                font-weight: bold;
                                color: #4a2b3d;
                              "
                            >
                              {{date_icon}} {{date_type}}
                            </p>
                            <p
                              style="
                                margin: 14px 0 0;
                                padding-top: 12px;
                                border-top: 2px dashed #cfa8ba;
                                font-family: 'Courier New', Courier, monospace;
                                font-size: 11px;
                                font-weight: bold;
                                letter-spacing: 3px;
                                color: #ff5fa2;
                              "
                            >
                              CONFIRMED
                            </p>
                          </td>
                        </tr>
                      </table>

                      <!-- The note -->
                      <p
                        style="
                          margin: 26px 0 0;
                          font-family: 'Courier New', Courier, monospace;
                          font-size: 15px;
                          line-height: 1.7;
                          color: #4a2b3d;
                        "
                      >
                        {{love_note}}
                      </p>

                      <p
                        style="
                          margin: 16px 0 0;
                          font-family: 'Courier New', Courier, monospace;
                          font-size: 15px;
                          line-height: 1.7;
                          color: #4a2b3d;
                        "
                      >
                        {{love_note_2}}
                      </p>

                      <p
                        style="
                          margin: 26px 0 0;
                          text-align: center;
                          font-family: 'Trebuchet MS', Verdana, sans-serif;
                          font-size: 21px;
                          font-weight: bold;
                          line-height: 1.3;
                          color: #ff5fa2;
                        "
                      >
                        {{closing}}
                      </p>

                      <p
                        style="
                          margin: 18px 0 0;
                          text-align: center;
                          font-family: 'Courier New', Courier, monospace;
                          font-size: 14px;
                          font-style: italic;
                          color: #8a6376;
                        "
                      >
                        See you soon 🥰
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- Speaker grille -->
                <p
                  style="
                    margin: 12px 0 4px;
                    text-align: center;
                    font-family: 'Courier New', Courier, monospace;
                    font-size: 13px;
                    letter-spacing: 5px;
                    color: #a8778c;
                  "
                >
                  &bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;
                </p>
              </td>
            </tr>
          </table>

          <p
            style="
              margin: 18px 0 0;
              font-family: 'Courier New', Courier, monospace;
              font-size: 11px;
              font-weight: bold;
              letter-spacing: 2px;
              color: #7a5266;
            "
          >
            SENT BY THE LOVE-MACHINE 3000
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
